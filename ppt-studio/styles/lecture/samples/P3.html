<div class="B-title p3-t">会前、会中、会后</div>
<div class="p3-ft" style="left:106px">【单位名称】 · 开好一场短会</div><div class="p3-ft" style="right:106px">3 / 5</div>
<aside class="notes">解决办法分三段。会前，写一页纸：要什么结论、需要谁、带什么材料。会中，只议这一件事，跑题的话题记在一边，不当场展开。会后，当天发一张待办：谁、做什么、哪天交。如果会上发现缺关键信息，不硬拍板：记下来，会后补齐，再约一次短会。这一步是往回走的，但比拍错了再返工省得多。</aside>
