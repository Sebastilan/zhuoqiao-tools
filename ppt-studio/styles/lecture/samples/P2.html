<div class="B-title p2-t">会为什么越开越长</div>
<div class="B-sub p2-s">不是事情多，是<b>三个老毛病</b></div>
<div class="p2-ft" style="left:106px">【单位名称】 · 开好一场短会</div><div class="p2-ft" style="right:106px">2 / 5</div>
<aside class="notes">会越开越长，通常不是因为事情多，而是三个老毛病。第一，开会前没说清这次要拿到什么结论，大家边开边想。第二，该来的人没来，不该来的人都来了，一半时间在补背景。第三，散会时没人说清谁做什么、什么时候做完，下周还得再开一次。</aside>
